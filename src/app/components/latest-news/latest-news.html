<div class="latest-wrapper">
  <div class="latest-main">
    <div class="container">
      <div class="d-flex align-items-end justify-content-between gap-2 pb-space">
        <h2>Latest News</h2>
        <div class="d-flex btm-dots-latest">
          <button type="button" (click)="prevSlide()" class="left-arrow-btn">
            <span class="sun-icon-latest"></span>
          </button>
          <button type="button" (click)="nextSlide()" class="right-arrow-btn">
            <span class="hero-black-dot"></span>
          </button>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end">
      <div class="slider-main">
        <div class="slider-track">
          @for (article of newsArticles; track article.title) {
            <div class="card-child-wrapper">
              <div class="card-child">
                <div class="card-img-container">
                  <img class="card-img" [src]="article.image" [alt]="article.title" />
                </div>

                <div class="card-content">
                  <div class="card-meta d-flex align-items-center gap-4">
                    <div class="meta-item d-flex align-items-center">
                      <img src="/assets/images/person.png " alt="">
                      <span>BY {{ article.author | uppercase }}</span>
                    </div>
                    <div class="meta-item d-flex align-items-center">
                      <i class="fa-regular fa-calendar-days meta-icon"></i>
                      <span>{{ article.date | uppercase }}</span>
                    </div>
                  </div>

                  <h5 class="card-title">{{ article.title }}</h5>

                  <a href="#" class="read-more-btn d-inline-flex align-items-center gap-2">
                    Read more
                    <span class="arrow-right">→</span>
                  </a>
                </div>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
